# =============================================================================
# GraphCLIP v2 - CONCH Backbone (Paper settings)
# =============================================================================
# Matches the hyperparameters from the paper:
# - adam optimizer, LR=1e-3
# - 100 epochs
# - batch size 47 train / 100 test
# - OpenAI CLIP normalization stats
# - alpha_it=0.6, beta_it=0.7 (set in trainer code)

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 47
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

INPUT:
  SIZE: (448, 448)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "adam"
  LR: 1e-3
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 5
  CHECKPOINT_FREQ: 10

TEST:
  FINAL_MODEL: "last_step"

MODEL:
  BACKBONE:
    NAME: "conch"

TRAINER:
  COOP:
    PREC: "fp32"
